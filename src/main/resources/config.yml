# List of damagers.
damagers:
  # The identifier of the damager.
  stonecutter:
    # If the damager is enabled.
    enabled: true
    # Offset of the damager.
    offset:
      # X offset.
      x: 0
      # Y offset.
      y: 0
      # Z offset.
      z: 0
    # Ticks between hurting the entity.
    # 20 ticks = 1 second.
    ticks-per-damage: 10
    # Amount of damage points to hurt.
    # 1.0 = 1/2 of a heart.
    # 10.5 = 5 and 1/4 hearts.
    damage-amount: 3.0
    # Permission config.
    permission:
      # If the permission is required to be damaged.
      # Leave "" to disable.
      include: ""
      # If the permission is required to bypass the damage.
      # Leave "" to disable.
      exclude: "stonedamager.bypass"
    # Entity config.
    entities:
      # A list of entity types.
      # Find a full list at: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
      list: [] # Empty list.
      # If the list above is a blacklist.
      # true = do not damage these entities.
      # false = only damage these entities.
      is-blacklist: true
    # Worlds config.
    worlds:
      # A list of world names.
      list:
        - "lobby"
      # If the list above is a blacklist.
      # true = do not damage in these worlds.
      # false = only damage in these worlds.
      is-blacklist: true
    # Materials that count as a damager for this selection.
    materials:
      # A list of world names.
      list:
        - "STONECUTTER"
      # If the list above is a blacklist.
      # true = do not count these materials.
      # false = only count these materials.
      is-blacklist: false

  glass:
    enabled: false # Disabled due to this being an example.
    offset:
      x: 0
      y: -1 # 1 block below the entity.
      z: 0
    ticks-per-damage: 5
    damage-amount: 5.0
    permission:
      include: ""
      exclude: "stonedamager.bypass"
    entities:
      list: [] # Empty list.
      is-blacklist: true
    worlds:
      list:
        - "lobby"
      is-blacklist: true
    materials:
      list:
        - "GLASS"
      is-blacklist: false

# Settings for the damager system.
settings:
  # Try to find a player to count as the source of damage.
  # This is to allow for experience and loot drops.
  try-find-player:
    # If this feature is enabled.
    # true = Yes. Use this feature.
    # false = No. Do not use this feature.
    enabled: true
    # Maximum distance to search for a player (in blocks).
    # Can be a decimal value.
    radius: 30.0

# DO NOT TOUCH THIS.
config-version: "1.0"